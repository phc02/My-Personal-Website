<div class="twin-step-overlay" aria-label="原型实现步骤"><button class="twin-step" type="button" data-step="01" data-title="调研实现路径" data-tip="通过 B 站相关案例与教程，了解物流大屏是如何调用高德地图作为底图的，为设计方案选择可行的原型实现路径。" aria-label="01 调研实现路径" style="left:4.16666667%;top:39.72602740%;width:15.20833333%;height:6.69710807%"><span>调研实现路径</span><span class="twin-step-number">0 1</span></button><button class="twin-step" type="button" data-step="02" data-title="定制地图样式" data-tip="在高德开放平台配置自定义地图样式，以深色底图统一展示基调，为供应商标记、区域边界与状态信息建立视觉对比。" aria-label="02 定制地图样式" style="left:7.50000000%;top:52.51141553%;width:15.20833333%;height:6.69710807%"><span>定制地图样式</span><span class="twin-step-number">0 2</span></button><button class="twin-step" type="button" data-step="03" data-title="接入地图API" data-tip="发布地图样式，并在原型中接入地图 API 与样式 ID，使自定义底图成为后续视觉呈现和交互开发的基础。" aria-label="03 接入地图API" style="left:16.04166667%;top:65.29680365%;width:15.20833333%;height:6.69710807%"><span>接入地图API</span><span class="twin-step-number">0 3</span></button><button class="twin-step" type="button" data-step="04" data-title="查阅官方文档" data-tip="查阅高德开放平台官方文档，梳理地图配置与交互控制方式，确认设计落地与高德地图可调用能力之间的对应关系。" aria-label="04 查阅官方文档" style="left:13.95833333%;top:78.08219178%;width:25.98958333%;height:6.69710807%"><span>查阅官方文档</span><span class="twin-step-number">0 4</span></button><button class="twin-step" type="button" data-step="05" data-title="搭建大屏底图" data-tip="依据官方文档，使用 Gemini 辅助搭建大屏地图基础视图，将地图样式配置为可运行的页面，为业务信息提供载体。" aria-label="05 搭建大屏底图" style="left:27.70833333%;top:39.72602740%;width:23.95833333%;height:6.69710807%"><span>搭建大屏底图</span><span class="twin-step-number">0 5</span></button><button class="twin-step" type="button" data-step="06" data-title="调研区域绘制" data-tip="借助 Gemini 和 B 站教程，了解自定义地图区域的绘制方式，探索如何将供应商范围转化为原型中的空间边界。" aria-label="06 调研区域绘制" style="left:36.45833333%;top:52.51141553%;width:15.20833333%;height:6.69710807%"><span>调研区域绘制</span><span class="twin-step-number">0 6</span></button><button class="twin-step" type="button" data-step="07" data-title="构建区域边界" data-tip="使用阿里云 DataV 数据编辑器，通过点、线、面圈定三大供应商聚集区，将业务范围转化为地图中的区域表达。" aria-label="07 构建区域边界" style="left:45.00000000%;top:65.29680365%;width:15.20833333%;height:6.69710807%"><span>构建区域边界</span><span class="twin-step-number">0 7</span></button><button class="twin-step" type="button" data-step="08" data-title="导出边界数据" data-tip="导出区域对应的 GeoJSON 数据并放入 Demo 所在文件夹，为区域轮廓渲染及后续聚焦交互提供空间数据基础。" aria-label="08 导出边界数据" style="left:48.33333333%;top:78.08219178%;width:28.12500000%;height:6.69710807%"><span>导出边界数据</span><span class="twin-step-number">0 8</span></button><button class="twin-step" type="button" data-step="09" data-title="还原设计样式" data-tip="使用 Gemini 与 Codex 辅助还原设计稿，将地图标记和区域标签组织为可运行界面。" aria-label="09 还原设计样式" style="left:57.91666667%;top:39.72602740%;width:26.04166667%;height:6.69710807%"><span>还原设计样式</span><span class="twin-step-number">0 9</span></button><button class="twin-step" type="button" data-step="10" data-title="Coding核心交互" data-tip="依据产品需求与交互设计方案，开发区域点击、自动下钻、信息联动等功能，将静态页面串联为可操作的浏览流程。" aria-label="10 Coding核心交互" style="left:61.04166667%;top:52.51141553%;width:25.00000000%;height:6.69710807%"><span>Coding核心交互</span><span class="twin-step-number">1 0</span></button><button class="twin-step" type="button" data-step="11" data-title="搜集动效源码" data-tip="结合高德 Loca 数据可视化 API 2.0 与 React Bits 动效源码，实现地图中的动效，服务于信息引导与状态感知。" aria-label="11 搜集动效源码" style="left:72.91666667%;top:65.29680365%;width:15.20833333%;height:6.69710807%"><span>搜集动效源码</span><span class="twin-step-number">1 1</span></button><button class="twin-step" type="button" data-step="12" data-title="协同评审交付" data-tip="以可交互 Demo 组织产品、业务与研发三方联动设计评审，围绕操作路径、信息呈现及实现方式对齐设计方案，并将 Demo 交付研发，作为交互与动效落地的参考。" aria-label="12 协同评审交付" style="left:80.62500000%;top:78.08219178%;width:15.20833333%;height:6.69710807%"><span>协同评审交付</span><span class="twin-step-number">1 2</span></button></div></section>
